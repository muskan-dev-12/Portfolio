name: Build portfolio image
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t portfolio:${{ github.sha }} .
      - name: Smoke test
        run: |
          docker run -d --name site -p 8090:80 portfolio:${{ github.sha }}
          sleep 3
          curl -f http://localhost:8090/
